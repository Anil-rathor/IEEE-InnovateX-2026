<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IEEE InnovateX 2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f7f9fc;
      line-height: 1.6;
    }

    /* NAVBAR */
    nav {
      width: 100%;
      background: white;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      color: #183b78;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #4169b1;
    }

    .nav-register {
      background: #7256a8;
      color: white !important;
      padding: 10px 18px;
      border-radius: 8px;
    }

    /* HERO */
    .hero {
      min-height: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 8%;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 76px);
      color: #183b78;
      margin-bottom: 18px;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #7256a8;
    }

    .hero p {
      max-width: 720px;
      margin: auto;
      font-size: 18px;
      color: #596579;
    }

    .hero-buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: 8px;
      font-weight: 700;
      transition: 0.3s;
    }

    .btn-primary {
      background: #183b78;
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn-secondary {
      background: white;
      color: #183b78;
      border: 2px solid #183b78;
    }

    .btn-secondary:hover {
      background: #183b78;
      color: white;
    }

    /* LOGOS */
    .logos-section {
      background: white;
      padding: 45px 8%;
      border-bottom: 1px solid #e7eaf0;
    }

    .logos {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 55px;
      flex-wrap: wrap;
    }

    .logos img {
      width: 190px;
      height: 90px;
      object-fit: contain;
      display: block;
    }

    .logos img:first-child {
      width: 200px;
    }

    .mits-logo {
      font-size: 20px;
      font-weight: 700;
      color: #24456f;
      white-space: nowrap;
    }

    /* COMMON SECTION */
    section {
      padding: 80px 8%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      color: #183b78;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #697386;
    }

    /* SCHEDULE */
    .schedule-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
